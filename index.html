<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=7b362585-8013-400a-a00a-9d978a484e13
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <title>Daily Prayers</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="stylesheet" href="styles.css">
    <script type="module" src="firebase.js"></script>
    <script src="schedule.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

    <div class="bottom-nav">
        <div class="sync-indicator" id="syncStatus">Initializing...</div>
        <div class="nav-row">
            <button class="floating-btn" id="googleLoginBtn" onclick="handleAuth()">Login</button>
            <button class="floating-btn btn-gold" onclick="exportData()">Backup</button>
            <button class="floating-btn" id="themeBtn" onclick="toggleTheme()">Dark</button>
        </div>
    </div>

    <div class="sticky-header" id="headerNav">
        <div class="container">
            <header><h1>Daily Prayers</h1></header>
            <div class="day-selector" id="mainDaySelector"></div>
        </div>
    </div>

    <div class="container">
        <div class="main-layout">
            <div class="left-column">
                <div class="content-section" id="viewSection"><div id="prayerList"></div></div>
                <div class="content-section" id="addSection" style="display: none;">
                    <h3 id="addTitle" style="font-family: 'Cormorant Garamond', serif; margin-bottom:10px;">Add Prayer</h3>
                    <div id="typePicker" class="pgrid" style="display:none;"></div>
                    <div id="dayPicker" style="display:none;"></div>
                    <div id="nthPicker" style="display:none;"></div>
                    <div id="datePicker" style="display:none; margin:15px 0;"><input type="date" id="dateInput" style="padding:10px; width:100%; border:2px solid var(--sand); border-radius:8px; background:var(--cream); color:var(--text-color); font-size:1rem;"></div>
                    <label id="recurRow" class="spread-box" style="display:none; flex-direction:row; align-items:center; gap:8px; margin:5px 0 15px;"><input type="checkbox" id="spreadRecurring"> <span id="recurLabel">Repeat every month until deleted</span></label>
                    <div id="spreadPicker" class="spread-box" style="display:none;">
                        <label>How many times this month?<input type="number" id="spreadCount" min="1" max="31" value="4"></label>
                        <div style="font-size:0.8rem; opacity:0.7;">Placed on the days with the fewest prayers.</div>
                    </div>
                    <textarea id="prayerInput" placeholder="Write your prayer here..."></textarea>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <button class="nav-btn save-btn" onclick="saveNewPrayer()">Save Prayer</button>
                        <button class="nav-btn cancel-btn" onclick="showView()">Cancel</button>
                    </div>
                    <div id="specialManagerArea" style="display:none; margin-top:25px;">
                        <div style="font-size:0.8rem; font-weight:bold; color:var(--gold); border-top:1px solid var(--sand); padding-top:15px; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;">Your Special Groups</div>
                        <div id="specialItemsList"></div>
                    </div>
                </div>
            </div>
            <div class="right-column">
                <button class="nav-btn mode-btn active" id="viewModeBtn" onclick="showView()">View Prayers</button>
                <button class="nav-btn mode-btn" id="addModeBtn" onclick="openAddMode('day')">Add for Day</button>
                <button class="nav-btn special-btn" onclick="openAddMode('everyday')">+ Everyday</button>
                <button class="nav-btn special-btn" onclick="openAddMode('special')">+ Special Group</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalMsg" style="font-family: 'Cormorant Garamond', serif; margin-bottom: 20px;"></h3>
            <div id="modalInputContainer"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

</body>
</html>
