<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=7b362585-8013-400a-a00a-9d978a484e13
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <title>Daily Prayers</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="firebase.js"></script>
    <script src="schedule.js" defer></script>
    <script src="app.js" defer></script>
    <script src="addform.js" defer></script>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="bottom-nav">
        <div class="sync-indicator" id="syncStatus">Initializing...</div>
        <div class="nav-row">
            <button class="floating-btn" id="googleLoginBtn" onclick="handleAuth()">Login</button>
            <button class="floating-btn btn-gold" onclick="openBackupMenu()">Backup</button>
            <button class="floating-btn" id="themeBtn" onclick="toggleTheme()">Dark</button>
        </div>
    </div>

    <div class="sticky-header" id="headerNav">
        <div class="container">
            <header><h1>Daily Prayers</h1></header>
            <div class="day-selector" id="mainDaySelector"></div>
        </div>
    </div>

    <div class="container">
        <div class="main-layout">
            <div class="left-column">
                <div class="content-section" id="viewSection">
                    <input type="search" id="searchBox" placeholder="Search all prayers..." oninput="onSearch(this.value)">
                    <div id="progressLine"></div>
                    <div id="prayerList"></div>
                </div>
                <div class="content-section" id="answeredSection" style="display:none;"></div>
                <div class="content-section" id="calendarSection" style="display:none;"></div>
            </div>
            <div class="right-column">
                <button class="nav-btn mode-btn active" id="viewModeBtn" onclick="showView()">View Prayers</button>
                <button class="nav-btn special-btn" id="addModeBtn" onclick="openAdd()">+ Add Prayer</button>
                <button class="nav-btn mode-btn" id="calendarBtn" onclick="showCalendar()">Calendar</button>
                <button class="nav-btn mode-btn" id="answeredBtn" onclick="showAnswered()">Answered</button>
            </div>
        </div>
    </div>

    <div class="ap-overlay" id="addOverlay" hidden>
        <div class="ap-sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
            <div class="ap-head">
                <div class="ap-grabber"></div>
                <div class="ap-head-row">
                    <h2 id="addTitle">New Prayer</h2>
                    <button type="button" class="ap-cancel" onclick="closeAdd()">Cancel</button>
                </div>
            </div>
            <div class="ap-scroll" id="addScroll">
                <div class="ap-main">
                    <label class="ap-q" id="addTextLabel" for="prayerInput">Who or what are you praying for?</label>
                    <textarea id="prayerInput" placeholder="e.g. Sam, safe travels"></textarea>
                    <div id="addExtra" class="ap-extra"></div>
                    <span class="ap-q" id="addHowLabel">How often should it come up?</span>
                    <div class="ap-opts" id="addOpts"></div>
                </div>
                <div class="ap-side" id="addSide"></div>
            </div>
            <div class="ap-foot">
                <div class="ap-summary" id="addSummary" aria-live="polite"></div>
                <button type="button" class="ap-save" id="addSaveBtn" onclick="saveNewPrayer()">Add Prayer</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalMsg" style="font-family: 'Cormorant Garamond', serif; margin-bottom: 20px;"></h3>
            <div id="modalInputContainer"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

</body>
</html>
