<html lang="en">
<head>

    <title>Daily Prayers</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzsnkFikMGtsWkFR837c-n15ozxVjAGXk",
            authDomain: "prayer-app-cloud.firebaseapp.com",
            projectId: "prayer-app-cloud",
            storageBucket: "prayer-app-cloud.firebasestorage.app",
            messagingSenderId: "1090528891146",
            appId: "1:1090528891146:web:073dbda89ecd8682736af3",
            measurementId: "G-9NZMGRVZQ8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let cloudDB = { Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], Sunday: [], everyday: [] };
        let userDocRef = null;
        let unsubscribe = null;

        window.handleAuth = () => {
            if (!auth.currentUser) {
                signInWithPopup(auth, provider).catch(err => alert("Login failed: " + err.message));
            } else {
                signOut(auth).then(() => window.location.reload());
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('googleLoginBtn');
            const statusMsg = document.getElementById('syncStatus');

            if (user) {
                loginBtn.innerText = "Sign Out";
                statusMsg.innerText = "Connecting...";
                userDocRef = doc(db, "users", user.uid);

                if (unsubscribe) unsubscribe();
                unsubscribe = onSnapshot(userDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const incomingData = docSnap.data();
                        const isCloudEmpty = Object.values(incomingData).every(arr => arr.length === 0);
                        const localBackup = localStorage.getItem('prayer_backup');

                        if (isCloudEmpty && localBackup) {
                            statusMsg.innerText = "Using local backup";
                            cloudDB = JSON.parse(localBackup);
                        } else {
                            cloudDB = incomingData;
                            localStorage.setItem('prayer_backup', JSON.stringify(cloudDB));
                            statusMsg.innerText = "Cloud Synced";
                        }
                        renderPrayers();
                        renderSpecialManager();
                    } else {
                        statusMsg.innerText = "Cloud Empty";
                    }
                }, (err) => {
                    statusMsg.innerText = "Sync Error";
                });
            } else {
                loginBtn.innerText = "Login";
                statusMsg.innerText = "Guest Mode";
                cloudDB = { Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], Sunday: [], everyday: [] };
                renderPrayers();
            }
        });

        window.getDB = () => cloudDB;

        window.saveDB = async (newData) => {
            const isOldDataNotEmpty = Object.values(cloudDB).some(arr => arr.length > 0);
            const isNewDataEmpty = Object.values(newData).every(arr => arr.length === 0);

            if (isOldDataNotEmpty && isNewDataEmpty) {
                console.error("Safety Valve: Blocked empty overwrite.");
                return;
            }

            if (userDocRef) {
                try {
                    await setDoc(userDocRef, newData);
                    localStorage.setItem('prayer_backup', JSON.stringify(newData));
                } catch (e) {
                    console.error("Save Error", e);
                }
            } else {
                localStorage.setItem('prayer_backup', JSON.stringify(newData));
            }
        };

        window.exportData = () => {
            const data = JSON.stringify(getDB(), null, 2);
            navigator.clipboard.writeText(data).then(() => {
                alert("Copied! Paste this into Notes for safekeeping.");
            }).catch(() => alert("Copy failed. Check permissions."));
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Lato:wght@300;400&display=swap');

        :root {
            --cream: #faf8f3; --sand: #e8e3d6; --terracotta: #c85a3e;
            --deep-green: #2d4538; --soft-green: #546b5a; --gold: #b8925a;
            --shadow: rgba(45, 69, 56, 0.1);
            --bg-gradient: linear-gradient(135deg, #faf8f3 0%, #e8e3d6 100%);
            --card-bg: white; --text-color: #2d4538;
        }

        [data-theme="dark"] {
            --cream: #1a1c1b; --sand: #2d2f2e; --terracotta: #e07a5f;
            --deep-green: #e8e3d6; --soft-green: #a8b0ab; --gold: #d4af37;
            --shadow: rgba(0, 0, 0, 0.4);
            --bg-gradient: linear-gradient(135deg, #121413 0%, #1a1c1b 100%);
            --card-bg: #242625; --text-color: #f4f1ea;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Lato', sans-serif; background: var(--bg-gradient); min-height: 100vh; color: var(--text-color); padding-bottom: 120px; }

        .container { max-width: 900px; margin: 0 auto; }
        .sticky-header { position: sticky; top: 0; background: var(--bg-gradient); z-index: 100; padding: calc(22px + env(safe-area-inset-top)) 20px 10px; }
        header { text-align: center; margin-bottom: 10px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; color: var(--deep-green); letter-spacing: 2px; }

        .bottom-nav { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 1000; pointer-events: none; }
        .nav-row { display: flex; justify-content: center; gap: 10px; width: 100%; pointer-events: auto; }

        .floating-btn { background: var(--deep-green); color: white; border: none; padding: 10px 15px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; box-shadow: 0 4px 10px var(--shadow); transition: 0.2s; font-family: 'Lato', sans-serif; text-transform: uppercase; }
        .btn-gold { background: var(--gold); }

        .sync-indicator { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: var(--soft-green); opacity: 0.8; }

        .main-layout { display: flex; gap: 20px; align-items: flex-start; padding: 0 20px; }
        .left-column { flex: 2; min-width: 0; }
        .right-column { flex: 1; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 160px; }

        .day-selector { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
        .day-btn { background: var(--card-bg); border: 1px solid var(--sand); padding: 10px 2px; border-radius: 10px; font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; cursor: pointer; color: var(--soft-green); text-align: center; }
        .day-btn.active { background: var(--gold); color: white; border-color: var(--gold); }

        .nav-btn { width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; border: none; font-family: 'Lato', sans-serif; font-size: 0.9rem; }
        .mode-btn { background: var(--card-bg); border: 2px solid var(--sand); color: var(--soft-green); }
        .mode-btn.active { background: var(--terracotta); color: white; border-color: var(--terracotta); }
        .special-btn { background: var(--soft-green); color: white; }
        .save-btn { background: var(--gold); color: white; font-weight: bold; }
        .cancel-btn { background: var(--card-bg); border: 2px solid var(--sand); color: var(--terracotta); }

        .content-section { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px var(--shadow); margin-bottom: 20px; }

        .prayer-item { display: flex; align-items: flex-start; background: var(--cream); padding: 15px; border-radius: 12px; border-left: 4px solid var(--gold); margin-bottom: 12px; transition: transform 0.1s; }
        .prayer-item.dragging { opacity: 0.5; background: var(--sand); transform: scale(1.02); z-index: 10; cursor: move; }
        .drag-handle { cursor: grab; padding: 0 15px; color: var(--gold); font-size: 1.5rem; user-select: none; align-self: center; touch-action: none; }

        .prayer-group-title { font-size: 0.7rem; font-weight: bold; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; border-bottom: 1px solid var(--sand); padding-bottom: 4px; }
        .prayer-content { flex-grow: 1; }
        .prayer-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .prayer-text { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; line-height: 1.3; }
        .prayer-actions { display: flex; align-items: center; gap: 12px; margin-left: 10px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text-color); opacity: 0.6; }

        .sub-list { margin-top: 8px; padding-left: 10px; border-top: 1px solid var(--sand); padding-top: 8px; }
        .sub-item { display: flex; align-items: center; padding: 4px 0; color: var(--soft-green); }
        .sub-text { flex-grow: 1; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
        .sub-delete { margin-left: 15px; font-size: 0.8rem; color: var(--terracotta); }

        textarea { width: 100%; padding: 15px; border: 2px solid var(--sand); border-radius: 10px; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; min-height: 120px; background: var(--cream); color: var(--text-color); margin-bottom: 10px; outline: none; }
        #dayPicker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .picker-day { padding: 10px; background: var(--cream); border-radius: 8px; text-align: center; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--sand); }
        .picker-day.selected { background: var(--terracotta); color: white; border-color: var(--terracotta); }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal { background: var(--card-bg); padding: 30px; border-radius: 20px; max-width: 90%; width: 400px; text-align: center; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .right-column { order: -1; flex-direction: row; flex-wrap: wrap; position: static; margin-bottom: 20px; }
            .nav-btn { flex: 1 1 45%; font-size: 0.8rem; }
            .day-selector { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="bottom-nav">
        <div class="sync-indicator" id="syncStatus">Initializing...</div>
        <div class="nav-row">
            <button class="floating-btn" id="googleLoginBtn" onclick="handleAuth()">Login</button>
            <button class="floating-btn btn-gold" onclick="exportData()">Backup</button>
            <button class="floating-btn" id="themeBtn" onclick="toggleTheme()">Dark</button>
        </div>
    </div>

    <div class="sticky-header" id="headerNav">
        <div class="container">
            <header><h1>Daily Prayers</h1></header>
            <div class="day-selector" id="mainDaySelector"></div>
        </div>
    </div>

    <div class="container">
        <div class="main-layout">
            <div class="left-column">
                <div class="content-section" id="viewSection"><div id="prayerList"></div></div>
                <div class="content-section" id="addSection" style="display: none;">
                    <h3 id="addTitle" style="font-family: 'Cormorant Garamond', serif; margin-bottom:10px;">Add Prayer</h3>
                    <div id="dayPicker" style="display:none;"></div>
                    <textarea id="prayerInput" placeholder="Write your prayer here..."></textarea>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <button class="nav-btn save-btn" onclick="saveNewPrayer()">Save Prayer</button>
                        <button class="nav-btn cancel-btn" onclick="showView()">Cancel</button>
                    </div>
                    <div id="specialManagerArea" style="display:none; margin-top:25px;">
                        <div style="font-size:0.8rem; font-weight:bold; color:var(--gold); border-top:1px solid var(--sand); padding-top:15px; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;">Your Special Groups</div>
                        <div id="specialItemsList"></div>
                    </div>
                </div>
            </div>
            <div class="right-column">
                <button class="nav-btn mode-btn active" id="viewModeBtn" onclick="showView()">View Prayers</button>
                <button class="nav-btn mode-btn" id="addModeBtn" onclick="openAddMode('day')">Add for Day</button>
                <button class="nav-btn special-btn" onclick="openAddMode('everyday')">+ Everyday</button>
                <button class="nav-btn special-btn" onclick="openAddMode('special')">+ Special Group</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalMsg" style="font-family: 'Cormorant Garamond', serif; margin-bottom: 20px;"></h3>
            <div id="modalInputContainer"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <script>
        let currentDay = '';
        let selectedCategory = 'day';
        let multiSelectedDays = [];
        const weekDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        let draggedItem = null;

        function initDragAndTouchEvents(el, dayKey) {
            el.addEventListener('dragstart', () => { draggedItem = el; setTimeout(() => el.classList.add('dragging'), 0); });
            el.addEventListener('dragend', () => { el.classList.remove('dragging'); saveOrder(el.closest('.drag-container')); draggedItem = null; });

            const handle = el.querySelector('.drag-handle');
            handle.addEventListener('touchstart', (e) => { draggedItem = el; el.classList.add('dragging'); }, {passive: true});

            handle.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                const container = el.closest('.drag-container');
                const overItem = target ? target.closest('.prayer-item') : null;

                if (overItem && overItem !== el && overItem.closest('.drag-container') === container) {
                    e.preventDefault();
                    const rect = overItem.getBoundingClientRect();
                    const next = touch.clientY > rect.top + rect.height / 2;
                    container.insertBefore(el, next ? overItem.nextSibling : overItem);
                }
            }, {passive: false});

            handle.addEventListener('touchend', () => { el.classList.remove('dragging'); saveOrder(el.closest('.drag-container')); draggedItem = null; });
        }

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!draggedItem) return;
            const container = draggedItem.closest('.drag-container');
            const overItem = e.target.closest('.prayer-item');
            if (overItem && overItem !== draggedItem && overItem.closest('.drag-container') === container) {
                const rect = overItem.getBoundingClientRect();
                const next = e.clientY > rect.top + rect.height / 2;
                container.insertBefore(draggedItem, next ? overItem.nextSibling : overItem);
            }
        });

        function saveOrder(container) {
            if (!container) return;
            const listKey = container.dataset.key;
            const children = [...container.querySelectorAll('.prayer-item')];
            const db = getDB();
            const newOrder = children.map(c => JSON.parse(c.dataset.raw));

            if (listKey === 'everyday') {
                db.everyday = newOrder;
            } else {
                const isSpecialSection = children[0]?.classList.contains('is-special-item');
                if (isSpecialSection) {
                    const nonSpecial = db[currentDay].filter(p => !p.isSpecial);
                    db[currentDay] = [...newOrder, ...nonSpecial];
                } else {
                    const specials = db[currentDay].filter(p => p.isSpecial);
                    db[currentDay] = [...specials, ...newOrder];
                }
            }
            saveDB(db);
        }

        function showModal(msg, buttons, showInput = false, prefillValue = '') {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalMsg').innerText = msg;
            const container = document.getElementById('modalButtons');
            const inputContainer = document.getElementById('modalInputContainer');
            inputContainer.innerHTML = showInput ? `<input type="text" id="modalField" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:2px solid var(--sand); font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; outline:none;" placeholder="...">` : '';
            if (showInput) document.getElementById('modalField').value = prefillValue;
            container.innerHTML = '';
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.style.background = b.bg || 'var(--sand)';
                btn.style.color = b.color || 'var(--text-color)';
                btn.innerText = b.text;
                btn.onclick = () => {
                    const val = showInput ? document.getElementById('modalField').value.trim() : null;
                    overlay.style.display = 'none';
                    b.action(val);
                };
                container.appendChild(btn);
            });
            overlay.style.display = 'flex';
        }

        function initDaySelector() {
            const container = document.getElementById('mainDaySelector');
            container.innerHTML = weekDays.map(d => `<button class="day-btn" id="btn-${d}" onclick="selectDay('${d}')">${d.substring(0,3)}</button>`).join('');
            const todayIdx = new Date().getDay();
            selectDay(weekDays[todayIdx === 0 ? 6 : todayIdx - 1]);
        }

        function selectDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + day).classList.add('active');
            document.getElementById('addModeBtn').innerText = `Add for ${day}`;
            showView();
        }

        function showView() {
            document.getElementById('viewSection').style.display = 'block';
            document.getElementById('addSection').style.display = 'none';
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('viewModeBtn').classList.add('active');
            renderPrayers();
        }

        let editingGroupId = null;

        function openAddMode(cat) {
            selectedCategory = cat;
            editingGroupId = null;
            document.getElementById('prayerInput').value = '';
            document.getElementById('viewSection').style.display = 'none';
            document.getElementById('addSection').style.display = 'block';
            document.getElementById('dayPicker').style.display = (cat === 'special') ? 'grid' : 'none';
            document.getElementById('specialManagerArea').style.display = (cat === 'special') ? 'block' : 'none';
            if(cat === 'special') { multiSelectedDays = []; renderDayPicker(); renderSpecialManager(); }
            document.getElementById('addTitle').innerText = cat === 'everyday' ? "Everyday Prayer" : (cat === 'special' ? "Special Prayer" : `${currentDay} Prayer`);
        }

        function renderDayPicker() {
            document.getElementById('dayPicker').innerHTML = weekDays.map(d => `<div class="picker-day ${multiSelectedDays.includes(d) ? 'selected' : ''}" onclick="togglePickerDay('${d}')">${d.substring(0,3)}</div>`).join('');
        }

        function togglePickerDay(day) {
            const idx = multiSelectedDays.indexOf(day);
            idx > -1 ? multiSelectedDays.splice(idx, 1) : multiSelectedDays.push(day);
            renderDayPicker();
        }

        function openEditGroupDays(groupId) {
            const db = getDB();
            const insts = weekDays.map(d => db[d].find(p => p.groupId === groupId)).filter(Boolean);
            if (!insts.length) return;
            openAddMode('special');
            editingGroupId = groupId;
            multiSelectedDays = weekDays.filter(d => db[d].some(p => p.groupId === groupId));
            document.getElementById('prayerInput').value = insts[0].text;
            document.getElementById('addTitle').innerText = "Edit Special Prayer";
            renderDayPicker();
        }

        function saveGroupEdit(text) {
            const db = getDB();
            const template = weekDays.map(d => db[d].find(p => p.groupId === editingGroupId)).find(Boolean);
            weekDays.forEach(d => {
                const idx = db[d].findIndex(p => p.groupId === editingGroupId);
                if (!multiSelectedDays.includes(d)) {
                    if (idx > -1) db[d].splice(idx, 1);
                } else if (idx > -1) {
                    db[d][idx].text = text;
                } else {
                    const subs = JSON.parse(JSON.stringify(template.subs || []));
                    db[d].push({ id: Date.now()+Math.random(), groupId: editingGroupId, text, subs, isSpecial: true });
                }
            });
            saveDB(db);
        }

        function saveNewPrayer() {
            const text = document.getElementById('prayerInput').value.trim();
            if (!text) return;
            if (editingGroupId !== null) {
                if (multiSelectedDays.length === 0) return;
                saveGroupEdit(text);
                editingGroupId = null;
                showView();
                return;
            }
            const db = getDB();
            if (selectedCategory === 'special') {
                if (multiSelectedDays.length === 0) return;
                const gId = Date.now();
                multiSelectedDays.forEach(day => db[day].push({ id: Date.now()+Math.random(), groupId: gId, text, subs: [], isSpecial: true }));
            } else if (selectedCategory === 'everyday') {
                db.everyday.push({ id: Date.now(), text, subs: [] });
            } else {
                db[currentDay].push({ id: Date.now(), text, subs: [] });
            }
            saveDB(db);
            showView();
        }

        function addSub(dayKey, id) {
            showModal("Add point:", [
                { text: "Save", bg: 'var(--gold)', color: 'white', action: (val) => {
                    const db = getDB();
                    const p = db[dayKey].find(x => x.id === id);
                    if (!p) return;
                    if (p.isSpecial && p.groupId) {
                        setTimeout(() => {
                            showModal("Add to all days in group?", [
                                { text: "Just Today", action: () => {
                                    if(!p.subs) p.subs = [];
                                    p.subs.push({id: Date.now(), text: val});
                                    saveDB(db);
                                }},
                                { text: "All Days", bg: 'var(--gold)', color: 'white', action: () => {
                                    const gId = p.groupId;
                                    weekDays.forEach(d => {
                                        const inst = db[d].find(pr => pr.groupId === gId);
                                        if(inst) { if(!inst.subs) inst.subs = []; inst.subs.push({id: Date.now()+Math.random(), text: val}); }
                                    });
                                    saveDB(db);
                                }},
                                { text: "Cancel", isCancel: true, action: () => {} }
                            ]);
                        }, 300);
                    } else {
                        if(!p.subs) p.subs = [];
                        p.subs.push({id: Date.now(), text: val});
                        saveDB(db);
                    }
                }},
                { text: "Cancel", isCancel: true, action: () => {} }
            ], true);
        }

        function editPrayerRequest(dayKey, id, groupId = null) {
            const db = getDB();
            const p = db[dayKey].find(x => x.id === id);
            if (!p) return;
            if (groupId) {
                showModal("Edit special prayer text:", [
                    { text: "Just Today", action: (val) => {
                        if (!val) return;
                        p.text = val;
                        saveDB(db);
                    }},
                    { text: "All Days", bg: 'var(--gold)', color: 'white', action: (val) => {
                        if (!val) return;
                        weekDays.forEach(d => {
                            const inst = db[d].find(pr => pr.groupId === groupId);
                            if (inst) inst.text = val;
                        });
                        saveDB(db);
                    }},
                    { text: "Change Days", action: () => openEditGroupDays(groupId) },
                    { text: "Cancel", isCancel: true, action: () => {} }
                ], true, p.text);
            } else {
                showModal("Edit prayer text:", [
                    { text: "Save", bg: 'var(--gold)', color: 'white', action: (val) => {
                        if (!val) return;
                        p.text = val;
                        saveDB(db);
                    }},
                    { text: "Cancel", isCancel: true, action: () => {} }
                ], true, p.text);
            }
        }

        function deletePrayerRequest(dayKey, id, groupId = null) {
            const db = getDB();
            if (groupId) {
                showModal("Delete Special Prayer?", [
                    { text: "Today Only", action: () => { db[dayKey] = db[dayKey].filter(p => p.id !== id); saveDB(db); }},
                    { text: "All Days", bg: 'var(--terracotta)', color: 'white', action: () => {
                        weekDays.forEach(d => db[d] = db[d].filter(p => p.groupId !== groupId));
                        saveDB(db);
                    }},
                    { text: "Cancel", isCancel: true, action: () => {} }
                ]);
            } else {
                showModal("Delete this prayer?", [
                    { text: "Delete", bg: 'var(--terracotta)', color: 'white', action: () => {
                        db[dayKey] = db[dayKey].filter(p => p.id !== id);
                        saveDB(db);
                    }},
                    { text: "Cancel", isCancel: true, action: () => {} }
                ]);
            }
        }

        function deleteSub(dk, pi, si) {
            const db = getDB();
            const p = db[dk].find(x => x.id === pi);
            if (!p) return;
            const subTxt = p.subs.find(s => s.id === si).text;
            if (p.isSpecial && p.groupId) {
                showModal("Delete point?", [
                    { text: "Today Only", action: () => { p.subs = p.subs.filter(s => s.id !== si); saveDB(db); }},
                    { text: "All Days", bg: 'var(--terracotta)', color: 'white', action: () => {
                        const gId = p.groupId;
                        weekDays.forEach(d => {
                            const inst = db[d].find(pr => pr.groupId === gId);
                            if(inst && inst.subs) inst.subs = inst.subs.filter(s => s.text !== subTxt);
                        });
                        saveDB(db);
                    }},
                    {text: "Cancel", isCancel: true, action: () => {}}
                ]);
            } else {
                p.subs = p.subs.filter(s => s.id !== si);
                saveDB(db);
            }
        }

        function renderPrayers() {
            const db = getDB();
            const listContainer = document.getElementById('prayerList');
            listContainer.innerHTML = '';

            const categories = [
                { key: 'everyday', label: 'Everyday', filter: (p) => true },
                { key: currentDay, label: 'Special Group', filter: (p) => p.isSpecial },
                { key: currentDay, label: currentDay, filter: (p) => !p.isSpecial }
            ];

            categories.forEach(cat => {
                const items = (db[cat.key] || []).filter(cat.filter);
                if (items.length === 0) return;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'drag-container';
                groupDiv.dataset.key = cat.key;
                groupDiv.innerHTML = `<div class="prayer-group-title">${cat.label}</div>`;

                items.forEach((p) => {
                    const pDiv = document.createElement('div');
                    pDiv.className = `prayer-item ${p.isSpecial ? 'is-special-item' : ''}`;
                    pDiv.draggable = true;
                    pDiv.dataset.raw = JSON.stringify(p);

                    let subsHtml = (p.subs || []).map(s => `
                        <div class="sub-item">
                            <span class="sub-text">• ${s.text}</span>
                            <button class="icon-btn sub-delete" onclick="event.stopPropagation(); deleteSub('${cat.key}', ${p.id}, ${s.id})">🗑</button>
                        </div>`).join('');

                    pDiv.innerHTML = `
                        <div class="drag-handle">≡</div>
                        <div class="prayer-content">
                            <div class="prayer-header">
                                <div class="prayer-text">${p.text}</div>
                                <div class="prayer-actions">
                                    <button class="icon-btn" onclick="event.stopPropagation(); addSub('${cat.key}', ${p.id})">➕</button>
                                    <button class="icon-btn" onclick="event.stopPropagation(); editPrayerRequest('${cat.key}', ${p.id}, ${p.groupId})">✏️</button>
                                    <button class="icon-btn" onclick="event.stopPropagation(); deletePrayerRequest('${cat.key}', ${p.id}, ${p.groupId})">🗑</button>
                                </div>
                            </div>
                            ${subsHtml ? `<div class="sub-list">${subsHtml}</div>` : ''}
                        </div>
                    `;
                    initDragAndTouchEvents(pDiv, cat.key);
                    groupDiv.appendChild(pDiv);
                });
                listContainer.appendChild(groupDiv);
            });

            if (listContainer.innerHTML === '') {
                listContainer.innerHTML = '<p style="text-align:center; padding:20px; opacity:0.5;">Empty.</p>';
            }
        }

        function renderSpecialManager() {
            const db = getDB();
            const groups = {};
            weekDays.forEach(d => { db[d].forEach(p => { if(p.isSpecial) groups[p.groupId] = p.text; }); });
            const html = Object.keys(groups).map(gId => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--cream); margin-bottom:8px; border-radius:10px; border: 1px solid var(--sand);">
                    <span style="font-family: 'Cormorant Garamond', serif; font-size:1rem;">${groups[gId]}</span>
                    <button class="icon-btn" style="color:var(--terracotta);" onclick="deletePrayerRequest('', 0, ${gId})">🗑</button>
                </div>`).join('');
            document.getElementById('specialItemsList').innerHTML = html || '<p style="font-size:0.8rem; opacity:0.5; text-align:center;">No groups.</p>';
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('prayerTheme', t);
            document.getElementById('themeBtn').innerText = t === 'dark' ? 'Light' : 'Dark';
        }

        document.documentElement.setAttribute('data-theme', localStorage.getItem('prayerTheme') || 'light');
        initDaySelector();
    </script>
</body>
</html>
